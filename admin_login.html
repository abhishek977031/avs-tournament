<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f19;
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #111827;
            border: 1px solid #273244;
            border-radius: 16px;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
            color: #00e5ff;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0b0f19;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            margin-top: 15px;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Admin Login</h1>

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>

</html>
