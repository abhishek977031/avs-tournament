<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            text-align: center;
            background: #111827;
            border: 1px solid #273244;
            border-radius: 20px;
            padding: 35px 25px;
        }

        .success {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #aeb7c6;
            line-height: 1.6;
        }

        .tournament {
            margin: 25px 0;
            padding: 18px;
            background: #0b0f19;
            border-radius: 12px;
            border: 1px solid #273244;
        }

        .game {
            color: #00e5ff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .primary {
            background: #00e5ff;
            color: #061018;
        }

        .secondary {
            background: #273244;
            color: white;
        }
    </style>

</head>

<body>

<div class="card">

    <div class="success">
        ✅
    </div>

    <h1>
        Registration Successful!
    </h1>

    <p>
        You have successfully registered for the tournament.
    </p>

    <div class="tournament">

        <div class="game">
            🎮 {{ tournament["game_name"] }}
        </div>

        <h2>
            {{ tournament["name"] }}
        </h2>

        <p>
            📅 {{ tournament["tournament_date"] }}<br>
            ⏰ {{ tournament["tournament_time"] }}
        </p>

    </div>

    <a
        href="/my-tournaments"
        class="btn primary"
    >
        🎮 My Tournaments
    </a>

    <a
        href="/"
        class="btn secondary"
    >
        ← Back to Home
    </a>

</div>

</body>

</html>
