<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Tournament</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            background: #0b0f19;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: #111827;
            border: 1px solid #273244;
            border-radius: 16px;
            padding: 25px;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0b0f19;
            color: white;
            outline: none;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #061018;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #00e5ff;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <a
        href="/admin"
        class="back"
    >
        ← Back to Dashboard
    </a>


    <div class="card">

        <h1>
            ✏️ Edit Tournament
        </h1>


        <form method="POST">


            <label>
                Tournament Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ tournament['name'] }}"
                required
            >


            <label>
                Game Name
            </label>

            <input
                type="text"
                name="game_name"
                value="{{ tournament['game_name'] }}"
                required
            >


            <label>
                Tournament Date
            </label>

            <input
                type="date"
                name="tournament_date"
                value="{{ tournament['tournament_date'] }}"
                required
            >


            <label>
                Tournament Time
            </label>

            <input
                type="time"
                name="tournament_time"
                value="{{ tournament['tournament_time'] }}"
                required
            >


            <label>
                Entry Fee
            </label>

            <input
                type="number"
                name="entry_fee"
                value="{{ tournament['entry_fee'] }}"
                min="0"
                step="0.01"
                required
            >


            <label>
                Prize Pool
            </label>

            <input
                type="number"
                name="prize_pool"
                value="{{ tournament['prize_pool'] }}"
                min="0"
                step="0.01"
                required
            >


            <label>
                Maximum Players
            </label>

            <input
                type="number"
                name="max_players"
                value="{{ tournament['max_players'] }}"
                min="1"
                required
            >


            <label>
                Status
            </label>

            <select name="status">

                <option
                    value="upcoming"
                    {% if tournament['status'] == 'upcoming' %}selected{% endif %}
                >
                    Upcoming
                </option>

                <option
                    value="live"
                    {% if tournament['status'] == 'live' %}selected{% endif %}
                >
                    Live
                </option>

                <option
                    value="completed"
                    {% if tournament['status'] == 'completed' %}selected{% endif %}
                >
                    Completed
                </option>

            </select>


            <label>
                Rules
            </label>

            <textarea
                name="rules"
            >{{ tournament['rules'] or '' }}</textarea>


            <button type="submit">
                💾 Save Changes
            </button>


        </form>

    </div>

</div>

</body>

</html>
