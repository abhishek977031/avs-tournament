<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Room</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0f19;
            color: white;
            padding: 25px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
        }

        .card {
            background: #111827;
            border: 1px solid #273244;
            border-radius: 16px;
            padding: 28px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .game {
            color: #00e5ff;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0b0f19;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #061018;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #00e5ff;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="/admin" class="back">
        ← Back to Dashboard
    </a>

    <div class="card">

        <div class="game">
            🎮 {{ tournament["game_name"] }}
        </div>

        <h1>Room Management</h1>

        <p>
            {{ tournament["name"] }}
        </p>

        <form method="POST">

            <label>Room ID</label>

            <input
                type="text"
                name="room_id"
                placeholder="Enter Room ID"
                required
            >

            <label>Room Password</label>

            <input
                type="text"
                name="room_password"
                placeholder="Enter Room Password"
                required
            >

            <label>Room Details Visible At</label>

            <input
                type="datetime-local"
                name="room_visible_at"
                required
            >

            <button type="submit">
                Save Room Details
            </button>

        </form>

    </div>

</div>

</body>

</html>
