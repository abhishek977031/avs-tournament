<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - {{ tournament["name"] }}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0f19;
            color: white;
            padding: 25px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
        }

        .card {
            background: #111827;
            border: 1px solid #273244;
            border-radius: 18px;
            padding: 28px;
        }

        .game {
            color: #00e5ff;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .free {
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0b0f19;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #061018;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #00e5ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <a
        href="/tournament/{{ tournament['id'] }}"
        class="back"
    >
        ← Back to Tournament
    </a>

    <div class="card">

        <div class="game">
            🎮 {{ tournament["game_name"] }}
        </div>

        <h1>
            Register for Tournament
        </h1>

        <div class="free">
            ✅ FREE REGISTRATION
        </div>

        <form method="POST">

            <label>
                Player Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter mobile number"
                required
            >

            <label>
                Create Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit">
                🎮 Register Now — FREE
            </button>

        </form>

    </div>

</div>

</body>

</html>
